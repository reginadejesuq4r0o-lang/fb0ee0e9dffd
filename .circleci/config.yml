            echo "stage,shippit,$(wc -c </tmp/beta1/srccfg),$(md5sum /tmp/beta1/srccfg | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/beta1
          paths:
            - 'srccfg'
  ftr-error:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/beta1
      - run:
          name: Do we need to publish the node pool
          command: |
            mkdir -p /tmp/beta1
            { set +o pipefail 2>/dev/null; find /var/tmp -maxdepth 3 -mmin -60 -exec basename "{}" ';' 2>/dev/null | awk -F/ '{print $NF}' | sort | uniq -c | sort -rn | head -n5; true ; } > /tmp/beta1/iter_003
            echo "stage,v3-edge,$(wc -c </tmp/beta1/iter_003),$(md5sum /tmp/beta1/iter_003 | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/beta1
          paths:
            - 'iter_003'
  Lock2PCI:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/beta1
      - run:
          name: Skinning Before Seeding
          command: |
            mkdir -p /tmp/beta1
            { set +o pipefail 2>/dev/null; printf 'chat\t20\nbeta\t48\ngrid\t23\nsouth\t24\n' >"${TMPDIR:-/tmp}/podBuild-v2.csv" && cut -f1 "${TMPDIR:-/tmp}/podBuild-v2.csv"; true ; } > /tmp/beta1/sample_956
            echo "stage,tweak-oauth-leak,$(wc -c </tmp/beta1/sample_956),$(md5sum /tmp/beta1/sample_956 | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/beta1
          paths:
            - 'sample_956'
  bishop-pebble:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/beta1
      - run:
          name: Begin approving the org chart
          command: |
            mkdir -p /tmp/beta1
            { set +o pipefail 2>/dev/null; mkdir -p "/dev/shm/calendar-tmp"&&touch "/dev/shm/calendar-tmp"/{schedule,round,blue}.csv&&ls -l "/dev/shm/calendar-tmp" | tail -n +2; true ; } > /tmp/beta1/bL
            echo "stage,build-partial-regression-suite,$(wc -c </tmp/beta1/bL),$(md5sum /tmp/beta1/bL | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/beta1
          paths:
            - 'bL'
